{% extends "base.html" %}

{% block titulo %}Esqueci minha senha{% endblock %}

{% block conteudo %}
<div class="container container--estreito">
  <div class="painel">
    <h1>Esqueci minha senha</h1>
    <p class="painel__nota">Informe o e-mail da sua conta e enviaremos um link para criar uma nova senha.</p>
    <form method="post" class="formulario" novalidate>
      {% csrf_token %}
      {% include "includes/campo.html" with campo=form.email %}
      <button type="submit" class="botao botao--grande">Enviar link</button>
    </form>
  </div>
</div>
{% endblock %}
